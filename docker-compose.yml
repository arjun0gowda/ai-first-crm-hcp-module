services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hcp_crm
      POSTGRES_USER: crm_user
      POSTGRES_PASSWORD: crm_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm_user -d hcp_crm"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://crm_user:crm_password@db:5432/hcp_crm
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000/api
    ports: ["5173:5173"]
    depends_on: [backend]

volumes:
  postgres_data:
